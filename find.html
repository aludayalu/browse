<input
    id="find-window"
    style="
        all: initial;
        box-sizing: border-box;
        position: fixed;
        right: 100px;
        top: 20px;
        padding: 2px 8px 3.5px;
        background: #222;
        color: white;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 6px;
        outline: none;
        font-family: Arial, sans-serif;
        font-size: 20px;
        z-index: 2147483647;
        display: none;
    "
    placeholder="Search"
    autocomplete="off"
>

<div
    id="find-outline"
    style="
        all: initial;
        box-sizing: border-box;
        position: fixed;
        pointer-events: none;
        padding: 3px;
        border-radius: 7px;
        background: linear-gradient(135deg, #ff3d7f, #ff8a00, #a855f7);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
        z-index: 2147483646;
        display: none;
    "
></div>
